<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documenttask work</title>
</head>

<body>
    <section>
        <form action="">
            <h2>Student Registration Form</h2>
            <table>
                <tr>
                    <td>
                        <label for="">Roll no:</label>
                    </td>
                    <td><input type="text" size="47px"></td>
                </tr>
                <tr>
                    <td><label for="">Student name:</label></td>
                    <td><input type="text" placeholder="First Name"> - <input type="text" placeholder="Last Name"></td>

                </tr>
                <tr>
                    <td><label for="">Father's name:</label></td>
                    <td><input type="text" size="47px"></td>
                </tr>
                <tr>
                    <td><label for="">Date of birth:</label></td>
                    <td><input type="text" placeholder="Day" size="5px"> - <input type="text" placeholder="Month"
                            size="5px"> - <input type="text" placeholder="Year" size="5px"></td>
                </tr>
                <tr>
                    <td><label for="">Mobile no:</label></td>
                    <td><input type="tel" placeholder="+91" size="1px"> - <input type="tel" size="38px"></td>

                </tr>
                <tr>
                    <td><label for="">Email id:</label></td>
                    <td><input type="email" size="47px"></td>
                </tr>
                <tr>
                    <td><label for="">Password:</label></td>
                    <td><input type="password" size="47px"></td>
                </tr>
                <tr>
                    <td><label for="">Gender:</label></td>
                    <td><input type="radio" name="Gender">Male <input type="radio" name="Gender">Female</td>

                </tr>
                <tr>
                    <td><label for="">Department:</label></td>
                    <td><input type="checkbox" size="1px"> CSE <input type="checkbox" size="1px"> IT <input
                            type="checkbox" size="1px">ECE <input type="checkbox" size="1px">Civil <input
                            type="checkbox"> Mech</td>

                </tr>
                <tr>
                    <td> <label for="">Course:</label></td>
                    <td>
                        <select name="">
                            <option value="">-------------Select Current Course's------</option>
                            <option value="">html</option>
                            <option value="">css</option>
                            <option value="">JavaScript</option>

                        </select>
                        </td>
                </tr>
                
                <tr>
                    <td><label for="">Student photo:</label></td>
                    <td><input type="file" placeholder="Choose File"></td>

                </tr>
                <tr>
                    <td><label for="">City:</label></td>
                    <td><input type="text" size="47px"></td>

                </tr>
                <tr>
                    <td><label for="">Adderss:</label></td>
                    <td><textarea name="" id="" aria- ></textarea></td>
                    

                </tr>
                <tr>
                    <td><input type="submit"></td>              </tr>
                



            </table>
        </form>
    </section>

</body>

</html>
